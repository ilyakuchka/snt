name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Diagnose values resources
        continue-on-error: true
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          mkdir -p /tmp/out
          for f in app/src/main/res/values*/*.xml; do
            $AAPT2 compile "$f" -o /tmp/out 2>&1 | head -3
          done | sort | uniq -c | sort -rn | head -40

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: messaging-debug-apk
          path: app/build/outputs/apk/debug/*.apk
